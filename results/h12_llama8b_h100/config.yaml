experiment_id: h12_subspace_safe_merge
hypothesis_id: H12
hypothesis: "Naive linear merge (Delta W_SQL + Delta W_unslop) of two specialized\
  \ GRPO adapters causes destructive gradient interference \u2014 degrading G_evidence\
  \ * R_correctness on SQL incidents or re-leaking slop/refusals. Orthogonalized TIES\
  \ / Gram-Schmidt Subspace-Safe Merge (Delta W_unslop^perp projected orthogonally\
  \ to both U_{refusal/slop} and top singular directions of Delta W_SQL with row-norm\
  \ preservation) retains >= 95% of both skills and passes the H11 FP8 E4M3 gate."
prediction: TIES biprojected subspace-safe merge retains sql_incident_retention_ratio
  >= 0.95 and unslop_retention_ratio >= 0.95, keeps slop_and_refusal_rate <= 0.02
  (nano) / <= 0.10 (3B), subspace_safe_merge_releakage < 1e-5 (nano), achieves ties_biprojected_vs_naive_merge_gain
  >= 0.15 on the joint benchmark (StatefulToolEnv + TenetUnslopRubric), and passes
  provider_ready == True (Row Crest-Factor < 25.0).
acceptance_criterion: sql_incident_retention_ratio >= 0.95 and slop_and_refusal_rate
  <= 0.02 and subspace_safe_merge_releakage < 1e-5 and ties_biprojected_vs_naive_merge_gain
  >= 0.15 and provider_ready == True
