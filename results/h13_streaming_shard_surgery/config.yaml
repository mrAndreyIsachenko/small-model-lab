experiment_id: h13_streaming_shard_surgery
hypothesis_id: H13
hypothesis: Layer-streaming safetensors shard surgery (apply_lancet_recipe_streaming)
  and shard-streaming TIES subspace-safe merge (stream_subspace_safe_ties_merge) with
  float32 Modified Gram-Schmidt and per-row L2-norm restoration match in-memory surgery
  and merge within < 1e-6 on sml-nano while bounding peak memory < 16 GB, local scratch
  disk delta < 15 GB, and FP8 E4M3 Row Crest-Factor < 25.0 for 32B-70B checkpoints
  on a single H100 80GB SXM.
prediction: Streaming surgery and merge achieve streaming_surgery_max_abs_diff < 1e-6
  and streaming_merge_max_abs_diff < 1e-6 on sml-nano, keep peak_memory_gb < 16.0
  and peak_disk_shard_gb < 15.0, and satisfy max_row_crest_factor < 25.0 and provider_ready
  == True across 32b-h100 (Qwen/Qwen2.5-32B-Instruct) and 70b-h100 (meta-llama/Llama-3.3-70B-Instruct).
acceptance_criterion: streaming_surgery_max_abs_diff < 1e-6 and streaming_merge_max_abs_diff
  < 1e-6 and peak_memory_gb < 16.0 and peak_disk_shard_gb < 15.0 and max_row_crest_factor
  < 25.0 and provider_ready == True
