experiment_id: h10_unslop_grpo
hypothesis_id: H10
hypothesis: "Gated \"unslop\" GRPO \u2014 reward shaping with a gated slop-and-refusal\
  \ penalty \u2014 drives the slop-and-refusal rate to <= 2% while beating naive reward-only\
  \ GRPO by >= 15% relative gain; composing the GRPO-tuned adapter with H9 Lancet\
  \ bi-projected surgery yields a further >= 15% gain, and merging the trained adapters\
  \ preserves logits within 1e-4 of the reference model."
prediction: After 27 GRPO steps (group size 6, lr 0.0038) on the nano model, slop_and_refusal_rate
  <= 0.02, gated reward shaping beats naive GRPO by >= 15% (h10_gated_vs_naive_gain
  >= 0.15), post-surgery composition adds >= 15% further gain (h10_post_surgery_gain
  >= 0.15), and merged LoRA logits stay within 1e-4 of the reference (max_abs_logit_diff
  < 1e-4).
acceptance_criterion: slop_and_refusal_rate <= 0.02 AND h10_gated_vs_naive_gain >=
  0.15 AND h10_post_surgery_gain >= 0.15 AND max_abs_logit_diff < 1e-4 AND h10_verified
  == True
