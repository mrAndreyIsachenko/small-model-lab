experiment_id: h10_unslop_grpo
hypothesis_id: H10
hypothesis: >
  Gated "unslop" GRPO — reward shaping with a gated slop-and-refusal penalty — drives the
  slop-and-refusal rate to <= 2% while beating naive reward-only GRPO by >= 15% relative
  gain; composing the GRPO-tuned adapter with H9 Lancet bi-projected surgery yields a
  further >= 15% gain, and merging the trained adapters preserves logits within 1e-4 of
  the reference model.
prediction: >
  After 27 GRPO steps (group size 6, lr 0.0038) on the nano model, slop_and_refusal_rate
  <= 0.02, gated reward shaping beats naive GRPO by >= 15% (h10_gated_vs_naive_gain
  >= 0.15), post-surgery composition adds >= 15% further gain (h10_post_surgery_gain
  >= 0.15), and merged LoRA logits stay within 1e-4 of the reference
  (max_abs_logit_diff < 1e-4).
acceptance_criterion: >
  slop_and_refusal_rate <= 0.02 AND h10_gated_vs_naive_gain >= 0.15 AND h10_post_surgery_gain >= 0.15 AND max_abs_logit_diff < 1e-4 AND h10_verified == True
seed: 2026
model_config_path: configs/model/sml_nano.yaml
data_config_path: configs/data/tinystories.yaml
hardware_config_path: configs/hardware/m4_pro_mps.yaml
train:
  batch_size_tokens: 4096
  micro_batch_size: 2
  seq_len: 512
  max_steps: 27
  lr: 0.0005
  min_lr_ratio: 0.1
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: wsd
  warmup_steps: 2
  decay_fraction: 0.2
  precision: bf16
  compile: false
