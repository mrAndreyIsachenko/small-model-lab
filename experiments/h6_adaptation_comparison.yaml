experiment_id: h6_adaptation_comparison
hypothesis_id: H6
hypothesis: >
  Enriching context via Hybrid RAG (BM25 + char n-gram RRF) resolves knowledge-bound table/schema lookups (>= 85% coverage),
  but weight updates via Rejection-Sampled Teacher Distillation + Multi-Turn Gated GRPO significantly outperform context-only
  strategies on skill-bound multi-step hypothesis elimination and confounder rejection (>= 20 pp gain).
prediction: >
  3_hybrid_rag achieves >= 0.85 knowledge_bound_score, while 6_grpo_gated_rl outperforms 3_hybrid_rag by >= 0.20 on
  skill_bound_score (G_evidence * R_correctness) and outperforms 6b_grpo_naive_additive by >= 0.15 (H5).
acceptance_criterion: >
  H6_verified == True AND H5_verified == True AND rag_retrieval_recall_at_1 == 1.0
seed: 2026
model_config_path: configs/model/sml_nano.yaml
data_config_path: configs/data/tinystories.yaml
hardware_config_path: configs/hardware/m4_pro_mps.yaml
train:
  batch_size_tokens: 4096
  micro_batch_size: 2
  seq_len: 512
  max_steps: 16
  lr: 0.0005
  min_lr_ratio: 0.1
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: wsd
  warmup_steps: 2
  decay_fraction: 0.2
  precision: bf16
  compile: false