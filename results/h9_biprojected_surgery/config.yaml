experiment_id: h9_biprojected_surgery
hypothesis_id: H9
hypothesis: Bi-projected rank-1 surgery ("Lancet") suppresses targeted refusal & slop
  write directions while keeping them orthogonal to the reasoning-anchor direction
  (<1e-6) and preserving row norms (<1e-5 drift), collapsing anchor-behaviour KL collateral
  by >= 35% versus naive unprojected all-layer surgery.
prediction: Lancet bi-projected surgery suppresses >= 90% of target direction activation
  with anchor_orthogonality_error < 1e-6 and max_row_norm_drift < 1e-5, while naive
  surgery incurs >= 35% more KL collateral on anchor behaviour (h9_kl_reduction_ratio
  >= 0.35).
acceptance_criterion: anchor_orthogonality_error < 1e-6 AND max_row_norm_drift < 1e-5
  AND target_suppression_ratio >= 0.90 AND h9_kl_reduction_ratio >= 0.35 AND h9_verified
  == True
